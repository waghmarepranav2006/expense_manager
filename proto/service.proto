syntax = "proto3";

package expense_manager.grpc;

service TransactionService {
  rpc GetStatus(StatusRequest) returns (StatusResponse);
  rpc ReserveResource(ReserveRequest) returns (ReserveResponse);
  rpc UpdateRecord(UpdateRequest) returns (UpdateResponse);
}

message StatusRequest {
  string service_name = 1;
  int32 lamport_timestamp = 2;
}

message StatusResponse {
  bool healthy = 1;
  string message = 2;
  int32 active_records = 3;
  int32 lamport_timestamp = 4;
}

message ReserveRequest {
  string resource_id = 1;
  int32 quantity = 2;
  string requester = 3;
  int32 lamport_timestamp = 4;
}

message ReserveResponse {
  bool success = 1;
  string reservation_id = 2;
  string message = 3;
  int32 reserved_quantity = 4;
  int32 lamport_timestamp = 5;
}

message UpdateRequest {
  string record_id = 1;
  string reservation_id = 2;
  string new_status = 3;
  int32 adjustment = 4;
  int32 lamport_timestamp = 5;
}

message UpdateResponse {
  bool success = 1;
  string message = 2;
  string updated_record_id = 3;
  int32 current_value = 4;
  int32 lamport_timestamp = 5;
}